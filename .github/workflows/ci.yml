name: CI

permissions:
    contents: read

on:
    push:
        branches:
            - master
    pull_request: ~

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    - '8.3'
                    - '8.4'
                    - '8.5'
        name: PHP ${{ matrix.php }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run tests
              run: vendor/bin/phpunit

            - name: Run static analysis
              run: vendor/bin/phpstan analyse --no-progress

    coding-standards:
        runs-on: ubuntu-latest
        name: Coding standards
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Check coding standards
              run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

    benchmark:
        runs-on: ubuntu-latest
        name: Benchmark
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            # A shared runner cannot hold a duration still, so nothing here is
            # asserted. This proves the benchmarks still execute against the
            # kernel, which is the part that rots unnoticed.
            - name: Run the benchmarks once
              run: vendor/bin/phpbench run --revs=1 --iterations=1 --progress=none --report=aggregate

    lowest-deps:
        runs-on: ubuntu-latest
        name: Lowest deps
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Install lowest dependencies
              run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

            - name: Run tests
              run: vendor/bin/phpunit

            - name: Run static analysis
              run: vendor/bin/phpstan analyse --no-progress
