# The workflow pins every action to a commit SHA, which is the only reference an
# upstream cannot move under us. Dependabot is what keeps those pins from going
# stale, raising a pull request with the new SHA and the version it stands for.
version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: ci
